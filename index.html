<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Che nota è?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Noto+Music&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F7;--card:#FFFFFF;--ink:#16181D;--soft:#5D6470;--line:#D5D9E0;--accent:#3346D3;--ok:#1F8A4D;--ko:#C23B2E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171C;--card:#1F2229;--ink:#ECEEF2;--soft:#A3AAB6;--line:#383D47;--accent:#7C8CFF;--ok:#4CC27D;--ko:#FF7466}}
:root[data-theme="dark"]{--bg:#15171C;--card:#1F2229;--ink:#ECEEF2;--soft:#A3AAB6;--line:#383D47;--accent:#7C8CFF;--ok:#4CC27D;--ko:#FF7466}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:24px 16px 32px}
[hidden]{display:none!important}
h1{font-size:1.6rem;font-weight:600;margin:0 0 6px}
h2{font-size:1.25rem;font-weight:600;margin:0 0 12px}
.lead{color:var(--soft);margin:0 0 20px;line-height:1.5}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;color:var(--soft)}
.bar .time{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:600;color:var(--ink)}
.staff{background:var(--card);border-radius:14px;padding:8px;margin-bottom:16px}
.staff svg{display:block;width:100%;height:auto}
.group{margin-bottom:14px}
.group p{margin:0 0 8px;font-size:.9rem;color:var(--soft)}
.row{display:flex;flex-wrap:nowrap;gap:6px}
.row button{flex:1 1 0;min-width:0;padding:0 2px;min-height:46px;font:inherit;font-size:1rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.main-btn{width:100%;min-height:52px;font:inherit;font-weight:600;font-size:1.05rem;border:0;border-radius:12px;background:var(--ink);color:var(--bg);cursor:pointer;margin-top:8px}
.ghost-btn{width:100%;min-height:46px;font:inherit;font-size:1rem;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;margin-top:12px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.feedback{min-height:1.5em;margin:6px 0 0;font-size:1.1rem;font-weight:600;text-align:center}
.feedback.ok{color:var(--ok)}.feedback.ko{color:var(--ko)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.stat{background:var(--card);border-radius:12px;padding:14px}
.stat b{display:block;font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--soft);font-size:.9rem}
.verdict{background:var(--card);border-radius:12px;padding:16px;margin:0 0 12px;line-height:1.5}
.missed{color:var(--soft);line-height:1.5;margin:0}
</style>
</head>
<body>
<main>
<section id="start">
<h1>Che nota è?</h1>
<p class="lead">Ti mostro una nota sull'endecagramma, tu scegli nome e ottava. Appena hai scelto entrambi, controllo subito e passo alla nota successiva.</p>
<div class="group"><p>Quanto vuoi giocare?</p><div class="row" id="modes"></div></div>
<button class="main-btn" id="startBtn">Inizia</button>
</section>

<section id="game" hidden>
<div class="bar"><span id="score">Giuste 0 su 0</span><span class="time" id="time">0:00</span></div>
<div class="staff"><svg id="svg" viewBox="0 0 360 340" role="img" aria-label="Endecagramma con una nota"></svg></div>
<div class="group"><p>Nota</p><div class="row" id="notes"></div></div>
<div class="group"><p>Ottava</p><div class="row" id="octaves"></div></div>
<p class="feedback" id="fb" aria-live="polite"></p>
<button class="ghost-btn" id="stopBtn">Ferma</button>
</section>

<section id="report" hidden>
<h2>Com'è andata</h2>
<div class="verdict" id="verdict"></div>
<div class="stats">
<div class="stat"><b id="rRight">0</b><span>giuste</span></div>
<div class="stat"><b id="rWrong">0</b><span>sbagliate</span></div>
<div class="stat"><b id="rAcc">0%</b><span>precisione</span></div>
<div class="stat"><b id="rAvg">0 s</b><span>tempo medio per nota</span></div>
</div>
<p class="missed" id="missed"></p>
<button class="main-btn" id="againBtn">Gioca ancora</button>
</section>
</main>
<script>
const NAMES=['Do','Re','Mi','Fa','Sol','La','Si'];
const OCT=[0,1,2,3,4,5];
const MODES=[{label:'1 min',sec:60},{label:'2 min',sec:120},{label:'5 min',sec:300},{label:'Senza tempo',sec:0}];
// n = indice diatonico interno (Do3 italiano = 28). Ottava italiana = floor(n/7)-1
const STAVES=[{bottomIdx:30,bottomY:118,lo:22,hi:46},{bottomIdx:18,bottomY:268,lo:10,hi:34}];
const $=id=>document.getElementById(id);
const svg=$('svg'),fb=$('fb'),notesEl=$('notes'),octEl=$('octaves'),modesEl=$('modes');
let mode=0,cur=null,selNote=null,selOct=null,locked=false,right=0,total=0,missed=[],t0=0,timer=null,nextTimer=null,running=false;

function draw(color){
  let s='';
  [70,220].forEach(t=>{for(let k=0;k<5;k++){const y=t+k*12;s+=`<line x1="6" y1="${y}" x2="354" y2="${y}" stroke="currentColor" stroke-width="1.2"/>`;}});
  s+=`<line x1="6" y1="70" x2="6" y2="268" stroke="currentColor" stroke-width="1.6"/>`;
  s+=`<line x1="354" y1="70" x2="354" y2="268" stroke="currentColor" stroke-width="1.2"/>`;
  s+=`<text x="14" y="118" font-family="'Noto Music'" font-size="48" fill="currentColor">&#x1D11E;</text>`;
  s+=`<text x="14" y="268" font-family="'Noto Music'" font-size="48" fill="currentColor">&#x1D122;</text>`;
  if(cur){
    const st=STAVES[cur.staff],b=st.bottomIdx,n=cur.n,x=220;
    const yOf=m=>st.bottomY-(m-b)*6;const L=[];
    if(n<b){for(let m=b-2;m>=n;m-=2)L.push(m);}
    if(n>b+8){for(let m=b+10;m<=n;m+=2)L.push(m);}
    L.forEach(m=>{s+=`<line x1="${x-14}" y1="${yOf(m)}" x2="${x+14}" y2="${yOf(m)}" stroke="currentColor" stroke-width="1.4"/>`;});
    const y=yOf(n);
    s+=`<ellipse cx="${x}" cy="${y}" rx="7.5" ry="5.2" fill="${color||'currentColor'}" transform="rotate(-20 ${x} ${y})"/>`;
  }
  svg.style.color='var(--ink)';svg.innerHTML=s;
}
const label=n=>NAMES[n%7]+(Math.floor(n/7)-1);
function makeButtons(el,items,fmt,onPick){
  items.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.textContent=fmt(v);b.setAttribute('aria-pressed','false');b.onclick=()=>onPick(i);el.appendChild(b);});
}
function mark(el,idx){[...el.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===idx)));}
makeButtons(modesEl,MODES,m=>m.label,i=>{mode=i;mark(modesEl,mode);});
makeButtons(notesEl,NAMES,v=>v,i=>{if(locked)return;selNote=i;mark(notesEl,i);check();});
makeButtons(octEl,OCT,v=>String(v),i=>{if(locked)return;selOct=OCT[i];mark(octEl,i);check();});
mark(modesEl,mode);

function newNote(){
  let c;
  do{const staff=Math.random()<0.5?0:1,st=STAVES[staff];c={staff,n:st.lo+Math.floor(Math.random()*(st.hi-st.lo+1))};}
  while(cur&&c.n===cur.n&&c.staff===cur.staff);
  cur=c;selNote=null;selOct=null;locked=false;
  mark(notesEl,-1);mark(octEl,-1);fb.textContent='';fb.className='feedback';draw();
}
function check(){
  if(selNote===null||selOct===null||!running)return;
  locked=true;total++;
  const guess=(selOct+1)*7+selNote;let wait;
  if(guess===cur.n){right++;fb.textContent='Giusto, è '+label(cur.n);fb.className='feedback ok';draw('var(--ok)');wait=700;}
  else{missed.push(label(cur.n));fb.textContent='Era '+label(cur.n)+', hai scelto '+NAMES[selNote]+selOct;fb.className='feedback ko';draw('var(--ko)');wait=1600;}
  $('score').textContent='Giuste '+right+' su '+total;
  nextTimer=setTimeout(()=>{if(running)newNote();},wait);
}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function tick(){
  const el=(Date.now()-t0)/1000,lim=MODES[mode].sec;
  if(lim){$('time').textContent=fmt(lim-el);if(el>=lim)stop();}
  else $('time').textContent=fmt(Math.floor(el));
}
function show(id){['start','game','report'].forEach(s=>$(s).hidden=s!==id);}
$('startBtn').onclick=()=>{
  right=0;total=0;missed=[];cur=null;running=true;
  $('score').textContent='Giuste 0 su 0';show('game');newNote();
  t0=Date.now();tick();timer=setInterval(tick,250);
};
function stop(){
  if(!running)return;running=false;clearInterval(timer);clearTimeout(nextTimer);
  const secs=(Date.now()-t0)/1000,acc=total?Math.round(right/total*100):0,avg=total?secs/total:0;
  $('rRight').textContent=right;$('rWrong').textContent=total-right;
  $('rAcc').textContent=acc+'%';$('rAvg').textContent=(total?avg.toFixed(1):'0')+' s';
  let v;
  if(total===0)v='Non hai risposto a nessuna nota. Riprova quando vuoi.';
  else if(acc>=90&&avg<=3)v='Ottimo: leggi le note in fretta e quasi senza errori.';
  else if(acc>=90)v='Molto preciso. Ora lavora sulla velocità, cercando di rispondere in meno di 3 secondi.';
  else if(acc>=75)v='Bravo, la base c\'è. Ripassa le note qui sotto, di solito sono quelle sui tagli addizionali.';
  else if(acc>=50)v='Discreto. Ti conviene ripassare il pentagramma senza fretta, magari con la modalità senza tempo.';
  else v='Ancora un po\' di allenamento: parti dalle note dentro il pentagramma e prova la modalità senza tempo.';
  $('verdict').textContent=v+' Hai risposto a '+total+' note in '+fmt(secs)+'.';
  const uniq=[...new Set(missed)];
  $('missed').textContent=uniq.length?'Note da ripassare: '+uniq.join(', ')+'.':'';
  show('report');
}
$('stopBtn').onclick=stop;
$('againBtn').onclick=()=>show('start');
draw();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!locked)draw();});
</script>
</body>
</html>
